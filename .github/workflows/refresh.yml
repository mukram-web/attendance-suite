# Dashboard rebuild — runs on GitHub's servers, never on Streamlit.
#
# It fetches the roster + L2, marks the Zoom attendee reports that are not
# marked yet, builds attendance.duckdb, and uploads it (plus the marked .xlsx)
# to the private Drive folder the app reads from.
#
# THERE IS NO SCHEDULE. The owner decided (2026-09-10) that nothing is ever
# rebuilt automatically: they upload each week's Zoom exports themselves and the
# dashboard's "Add data" page dispatches this workflow. So every run is
# deliberate, and `incremental` (default true) means past sessions are left
# exactly as they were marked — see CLAUDE.md §4g for what that costs.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   GDRIVE_SERVICE_ACCOUNT_JSON  the service-account key JSON (whole file)
#   ROSTER_ID                    Master Batch Rosters sheet id
#   L2_ID                        L2 schedule sheet id
#   ATTENDEE_FOLDER_ID           Weekly Sessions shared-drive id
#   STORE_FOLDER_ID              private Drive folder the store is uploaded to
#                                (shared with the service account as Editor).
#                                Also holds derived_facts.json.gz, the per-file
#                                parse memo that keeps this run incremental
#                                (CLAUDE.md 4f) - delete it to force a full
#                                re-parse, or tick no_cache below.
# Optional:
#   BSIAI_ROSTER_ID              BSIAI roster sheet id (its own programme tab)
#   CURRICULUM_ID                Master Curriculum Schedule sheet id (drives the
#                                Forecast tab; one tab per pod)
#
# "Run workflow" in the Actions tab triggers it manually any time.

name: Refresh dashboard data

on:
  # Dispatch only — no cron. Triggered by the dashboard's "Add data" page, or by
  # hand from the Actions tab.
  workflow_dispatch:
    inputs:
      incremental:
        description: "Only mark sessions that are not marked yet (fast). Untick for a full rebuild of every session."
        type: boolean
        default: true
      skip_upload:
        description: "Dry run — build everything but don't upload (use before the Drive folder exists)"
        type: boolean
        default: false
      no_cache:
        description: "Ignore the derived-facts memo and re-parse every Zoom export (slow, ~7 min)"
        type: boolean
        default: false
      publish_parallel:
        description: "Rebuild the LMS API dataset and publish it BESIDE the weekly one (this is what puts the app's Data set control on the deployed dashboard). Never touches the weekly store, next week's base or the archive."
        type: boolean
        default: false

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level so the deploy step's `if:` can test whether the token exists —
    # the secrets context isn't readable from a step-level `if`.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # NOTE: deliberately NO actions/cache here. The pipeline's .cache/ holds the
      # full roster export, the raw Zoom attendee CSVs and the DuckDB grids — all
      # student PII. THIS REPOSITORY IS PUBLIC, and Actions caches are restorable
      # by any workflow run in the repo (including fork PRs), so caching that
      # directory would publish 46k students' emails and phone numbers. A cold
      # download every Monday costs a couple of minutes of free runner time; that
      # is the right trade. Do not add a cache step for .cache/.
      #
      # The pipeline DOES keep a cross-run cache — derived_facts.json.gz, the
      # memoised per-file parse results — but it lives in the private store
      # folder on the Shared Drive, never here. Its payload is aggregates only
      # (durations, peaks, retention curves, poll histograms; no name, email or
      # phone — derived_cache._validate enforces that on the way in AND out), so
      # it would not leak PII even from an Actions cache. It still must not move
      # here: the rule above is BLANKET on purpose, because a blanket rule is
      # what survives the next person who adds one more path to a cache step
      # that already exists. Never create the precedent.

      - name: Run pipeline
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          ROSTER_ID: ${{ secrets.ROSTER_ID }}
          L2_ID: ${{ secrets.L2_ID }}
          ATTENDEE_FOLDER_ID: ${{ secrets.ATTENDEE_FOLDER_ID }}
          STORE_FOLDER_ID: ${{ secrets.STORE_FOLDER_ID }}
          # Optional: the BSIAI programme's roster Sheet. Unset -> the pipeline
          # skips that section and the app's BSIAI tab says so; AI CAP is
          # unaffected either way.
          BSIAI_ROSTER_ID: ${{ secrets.BSIAI_ROSTER_ID }}
          # Optional: the Master Curriculum Schedule (what is PLANNED). Unset ->
          # no forecast is built and the app's Forecast tab says so. This Sheet is
          # owned outside the roster team, so it needs sharing with the service
          # account separately - a 403 here only disables the forecast.
          CURRICULUM_ID: ${{ secrets.CURRICULUM_ID }}
          # Off by default: the site carries NO student contact details until the
          # /roster login gate has been verified on a real deploy (SETUP_PIPELINE.md).
          PUBLISH_ROSTER: ${{ secrets.PUBLISH_ROSTER }}
          # Where the roster comes from: unset or "sheet" reads the Google Sheet,
          # "lms" builds it from the 10xstats API instead (lms_roster.py). Flipping
          # this back is the rollback - no code change, no redeploy.
          ROSTER_SOURCE: ${{ secrets.ROSTER_SOURCE }}
          # Only needed when ROSTER_SOURCE=lms. Never echoed: the pipeline logs
          # batch codes and counts, never the key, and this repo is PUBLIC so its
          # Actions logs are world-readable.
          LMS_API_KEY: ${{ secrets.LMS_API_KEY }}
          # Optional: force which cohorts are re-fetched (e.g. "B40,B41").
          # Unset -> the two highest batch numbers, which is the intended rule.
          LMS_LIVE_BATCHES: ${{ secrets.LMS_LIVE_BATCHES }}
        run: |
          FLAGS=""
          if [ "${{ inputs.no_cache }}" = "true" ]; then
            echo "::notice::Ignoring the derived-facts memo — full re-parse."
            FLAGS="--no-cache"
          fi
          # A PARALLEL run builds the LMS API dataset and publishes it BESIDE
          # the weekly one, under its own name, which is the only way the app's
          # "Data set" control can appear on a deployment that has no local
          # disk. It deliberately IGNORES the `incremental` input: carrying last
          # week's marks forward is precisely what this dataset exists not to
          # do — every session is re-marked from the Zoom exports against a
          # roster taken from the API alone. --allow-partial because a pure API
          # roster legitimately lacks people the Sheet carried (§4h), and
          # --no-site because the website is built from the weekly record only.
          if [ "${{ inputs.publish_parallel }}" = "true" ]; then
            if [ "${{ inputs.skip_upload }}" = "true" ]; then
              echo "::notice::PARALLEL dry run — building the LMS dataset without publishing it."
              PUBLISH="--no-upload"
            else
              echo "::notice::PARALLEL dataset — LMS API roster, every session re-marked, published as attendance_lms.duckdb. The weekly store, next week's base and the archive are all untouched."
              PUBLISH="--publish-parallel"
            fi
            STORE_OUT=attendance_lms.duckdb ROSTER_SOURCE=lms LMS_PURE=1               python pipeline.py $PUBLISH --no-site --allow-partial $FLAGS
            exit 0
          fi

          if [ "${{ inputs.incremental }}" = "true" ]; then
            echo "::notice::Incremental — carrying last week's marks forward; only unmarked sessions are processed."
            FLAGS="$FLAGS --incremental"
          else
            echo "::notice::FULL rebuild — every session re-marked from the pristine roster."
          fi
          if [ "${{ inputs.skip_upload }}" = "true" ]; then
            echo "::notice::Dry run — building without uploading."
            python pipeline.py --no-upload --no-site $FLAGS
          else
            python pipeline.py $FLAGS
          fi

      # Publish site/ to Vercel. Skipped automatically until VERCEL_TOKEN exists,
      # so the data pipeline works before the website is set up.
      # site/ is never committed — it carries roster PII and is uploaded straight
      # to Vercel, where /roster is gated by middleware.js + ROSTER_USER/PASS.
      # (The CLI reads VERCEL_ORG_ID / VERCEL_PROJECT_ID from the job env to know
      # which project to deploy into, so no .vercel/ link file is needed.)
      - name: Deploy website to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          npm i -g vercel@latest
          url=$(vercel deploy site --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
